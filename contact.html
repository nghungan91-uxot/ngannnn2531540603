<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Ẩm Thực Việt Nam</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo">🍲 Hương Vị Việt</a>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Trang chủ</a></li>
                    <li><a href="about.html" class="nav-link">Giới thiệu</a></li>
                    <li><a href="products.html" class="nav-link">Món ăn</a></li>
                    <li><a href="services.html" class="nav-link">Dịch vụ</a></li>
                    <li><a href="gallery.html" class="nav-link">Thư viện</a></li>
                    <li><a href="blog.html" class="nav-link">Tin tức</a></li>
                    <li><a href="details.html" class="nav-link">Chi tiết</a></li>
                    <li><a href="contact.html" class="nav-link active">Liên hệ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container section">
        <h1 class="section-title">Liên Hệ Với Chúng Tôi</h1>
        <div style="max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px;">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" class="form-control" placeholder="Nhập họ và tên" required>
                </div>
                <div class="form-group">
                    <label for="email">Địa chỉ Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Nhập email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" class="form-control" placeholder="Nhập số điện thoại" required>
                </div>
                <div class="form-group">
                    <label for="note">Lời nhắn / Yêu cầu đặt bàn</label>
                    <textarea id="note" rows="4" class="form-control" placeholder="Nhập nội dung..." required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Gửi Yêu Cầu</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container footer-bottom">
            <p>&copy; 2026 Hương Vị Việt.</p>
        </div>
    </footer>
</body>
</html>
